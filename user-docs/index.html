<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ICE Witness Documentation</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Documentation for ICE Witness state repositories">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --base-font-size: 15px;
      --theme-color: #3F51B5;
    }

    /* Code block styling - more border, lighter background */
    .markdown-section code {
      background-color: #f8f9fa;
      border: 1px solid #e1e4e8;
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 0.9em;
    }

    .markdown-section pre {
      background-color: #f6f8fa;
      border: 2px solid #d0d7de;
      border-radius: 6px;
      padding: 16px;
    }

    .markdown-section pre code {
      background-color: transparent;
      border: none;
      padding: 0;
    }

    /* Sidebar styling */
    .sidebar {
      background-color: #fafbfc;
    }

    .sidebar-nav li a {
      color: #333;
    }

    .sidebar-nav li a:hover {
      color: #3F51B5;
    }

    /* Table styling */
    .markdown-section table {
      border-collapse: collapse;
      width: 100%;
      margin: 1em 0;
    }

    .markdown-section table th,
    .markdown-section table td {
      border: 1px solid #ddd;
      padding: 8px 12px;
      text-align: left;
    }

    .markdown-section table th {
      background-color: #f6f8fa;
      font-weight: 600;
    }

    .markdown-section table tr:nth-child(even) {
      background-color: #fafbfc;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'ICE Witness',
      repo: 'https://github.com/mn-ice-witness',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      search: {
        placeholder: 'Search',
        noData: 'No Results',
        depth: 3
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
</body>
</html>
